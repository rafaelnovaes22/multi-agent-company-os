id: g5-secrets-scanner
guild: G05-seguranca-compliance
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
multi_tenant: false
act_handler: secret_scan

outcome_clause:
  statement: "Nenhum segredo entra no histórico de produção sem ser bloqueado ou, se já presente, sinalizado e rotacionado."
  positive_examples:
    - "Bloqueia PR com chave de API hardcoded e sugere uso de cofre via C7."
    - "Detecta token vazado em log e dispara rotação confirmada."
    - "Varredura de histórico encontra credencial antiga e abre ticket de revogação."
  negative_examples:
    - "Deixa passar segredo de alta entropia em arquivo de config."
    - "Bloqueia merge por falso-positivo sem caminho de allowlist auditável."
    - "Marca segredo como remediado sem confirmar rotação/revogação."
  delivered_event: "secrets.scan_completed emitido (zero segredos novos) ou secrets.finding_opened com plano de rotação."

guardians:
  - security-privacy-guardian
  - artifact-architect-guardian
  - observability-guardian

tools:
  - repo.read
  - brain.query
  - brain.write
  - secret.scan
  - ci.run
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
