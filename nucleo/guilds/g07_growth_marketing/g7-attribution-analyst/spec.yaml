id: g7-attribution-analyst
guild: G07-growth-marketing
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
act_handler: spec_driven
outcome_clause:
  statement: 'Attribution Analyst entrega attribution-analyst.artifact verificável
    para: atribuir resultados aos canais com honestidade metodológica, para que o
    orçamento siga o que realmente funciona'
  positive_examples:
  - Modelo de atribuição reconciliado com a fonte de verdade de G6
  - Recomendação de realocação que sobe o ROI agregado de growth
  - Double-counting de canal detectado e corrigido
  negative_examples:
  - Atribuição que não fecha com os totais de G6
  - Relatório sem CAC/payback por canal
  - Recomendação que viola a regra delight > pago
  delivered_event: attribution.model.v_bumped && reconciliation.passed
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- metrics.read
- nl2sql
- brain.query
- brain.write
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
