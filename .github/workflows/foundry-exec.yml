name: foundry-exec (nightly)

# Execução REAL (VERIFY-IN-EVAL F2) — roda código dos eval-cases num contêiner hardened.
# SEPARADO do gate foundry.yml e fora de pull_request por SEGURANÇA: executa código só no main
# já mergeado/revisado, em runner Linux+Docker. Disparo: nightly (cron) + manual (dispatch).
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC diário
  workflow_dispatch:

permissions:
  contents: read
  id-token: write              # OIDC p/ Workload Identity Federation (geração red→green, Vertex)

jobs:
  foundry-exec:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      EXEC_PROVIDER: docker
      EXEC_IMAGE: nucleo-exec:latest
      EXEC_IMAGE_NODE: nucleo-exec-node:latest
      EXEC_IMAGE_TERRAFORM: nucleo-exec-terraform:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai
      - name: Build imagem de execução Python (com rede; os runs depois são --network none)
        run: docker build -t nucleo-exec:latest -f nucleo/quality/exec.Dockerfile nucleo/quality
      - name: Build imagem de execução Node/vitest (build do frontend, F3a-2)
        run: docker build -t nucleo-exec-node:latest -f nucleo/quality/exec.node.Dockerfile nucleo/quality
      - name: Build imagem de execução terraform (ops/dry-run, F4a)
        run: docker build -t nucleo-exec-terraform:latest -f nucleo/quality/exec.terraform.Dockerfile nucleo/quality
      - name: Teste de integração do DockerExecutor (sandbox real — pytest + vitest)
        run: python -m unittest tests.test_docker_executor
      - name: Relatório de execução do piloto (humano + JSON)
        run: |
          python -m nucleo.quality.exec_report --json-output exec_report.json nucleo/guilds/g03_engenharia/g3-build-error-resolver | tee exec_report.txt
      - name: Relatório de execução do g3-backend-builder (F3, held-out)
        run: |
          python -m nucleo.quality.exec_report --json-output exec_report_backend.json nucleo/guilds/g03_engenharia/g3-backend-builder | tee exec_report_backend.txt
      - name: Relatório de execução do g3-frontend-builder (F3a-2, Node/vitest)
        run: |
          python -m nucleo.quality.exec_report --json-output exec_report_frontend.json nucleo/guilds/g03_engenharia/g3-frontend-builder | tee exec_report_frontend.txt
      - name: Relatório de execução do g3-infra-devops (F4a, terraform)
        run: |
          python -m nucleo.quality.exec_report --json-output exec_report_infra.json nucleo/guilds/g03_engenharia/g3-infra-devops | tee exec_report_infra.txt
      - name: Relatório opcional do g4-e2e-playwright (F4c, browser/static oracle)
        continue-on-error: true
        run: |
          python -m nucleo.quality.exec_report --audit-only --audit-reason browser_static_oracle --json-output exec_report_browser.json nucleo/guilds/g04_qualidade_eval/g4-e2e-playwright | tee exec_report_browser.txt
      - name: Relatório de execução do g3-mobile-builder (F4d, mobile/Node held-out)
        # Promovido ao gate estrito em 2026-07-01: o 0/30 era harness quebrado (test_cmd jest
        # numa imagem vitest + held-outs sem import); consertado, entrega 30/30 validado local.
        run: |
          python -m nucleo.quality.exec_report --json-output exec_report_mobile.json nucleo/guilds/g03_engenharia/g3-mobile-builder | tee exec_report_mobile.txt
      - name: Relatório opcional do g3-incident-responder (F4b, structural postmortem oracle)
        continue-on-error: true
        run: |
          python -m nucleo.quality.exec_report --audit-only --audit-reason incident_structural_oracle --json-output exec_report_incident.json nucleo/guilds/g03_engenharia/g3-incident-responder | tee exec_report_incident.txt
      # ---- fase GERADORA (épico red→green, plano §4.7) — AUDITORIA, não gate ----
      # Mede o AGENTE (LLM real gera o artefato e itera contra o executor; held-out decide
      # delivered) — número separado do replay de fixtures acima. Vira gate (G7 generativo)
      # só quando estiver medido e verde; até lá continue-on-error preserva o nightly.
      - name: Auth GCP (Vertex p/ geração red→green)
        id: gcp-auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - name: Relatórios GENERATIVOS dos 5 exec-backed (red→green com LLM real; auditoria)
        if: steps.gcp-auth.outcome == 'success'
        continue-on-error: true
        env:
          LLM_PROVIDER: vertex
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: novais-digital-multiagentes
          GOOGLE_CLOUD_LOCATION: us-central1
        # Piloto (teste visível na semente = loop executável); backend/frontend/mobile iteram
        # via sonda estática (semente sem teste visível — held-out oculto decide no final);
        # infra itera via terraform validate. Cada agente publica seu artifact separado.
        run: |
          fail=0
          for agent in g3-build-error-resolver:gen g3-backend-builder:gen_backend g3-frontend-builder:gen_frontend g3-infra-devops:gen_infra g3-mobile-builder:gen_mobile; do
            dir="nucleo/guilds/g03_engenharia/${agent%%:*}"; suffix="${agent##*:}"
            python -m nucleo.quality.exec_report --generative --require-real-llm \
              --json-output "exec_report_${suffix}.json" "$dir" | tee "exec_report_${suffix}.txt" \
              || { echo "::warning::generativo falhou p/ ${agent%%:*} (auditoria segue)"; fail=1; }
          done
          exit $fail
      - name: Gate F6 dos artifacts de execução real creditáveis
        run: |
          python -m nucleo.quality.exec_artifact_gate \
            exec_report.json \
            exec_report_backend.json \
            exec_report_frontend.json \
            exec_report_infra.json \
            exec_report_mobile.json
      - name: Publicar artefatos do relatório VERIFY-IN-EVAL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-in-eval-exec-report
          path: |
            exec_report.txt
            exec_report.json
            exec_report_backend.txt
            exec_report_backend.json
            exec_report_frontend.txt
            exec_report_frontend.json
            exec_report_infra.txt
            exec_report_infra.json
            exec_report_browser.txt
            exec_report_browser.json
            exec_report_mobile.txt
            exec_report_mobile.json
            exec_report_incident.txt
            exec_report_incident.json
            exec_report_gen.txt
            exec_report_gen.json
            exec_report_gen_backend.txt
            exec_report_gen_backend.json
            exec_report_gen_frontend.txt
            exec_report_gen_frontend.json
            exec_report_gen_infra.txt
            exec_report_gen_infra.json
            exec_report_gen_mobile.txt
            exec_report_gen_mobile.json
