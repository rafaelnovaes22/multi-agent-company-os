id: g4-load-tester
guild: G04-qualidade-eval
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: false
act_handler: load_sla

outcome_clause:
  statement: "Todo agente/UI promovido para produção tem SLA validado sob carga prevista, com ponto de saturação e custo conhecidos."
  positive_examples:
    - "p95 medido em 1.8s contra target 2s sob 3x o pico previsto — PASS"
    - "Gargalo identificado na fila de outcomes com evidência antes de ir a produção"
    - "Custo sob carga cruzado com C3 e dentro de 25% do preço para um output BL"
  negative_examples:
    - "Promoção a AUTONOMOUS sem teste de carga"
    - "SLA reportado sem p95/p99, apenas média"
    - "Custo sob carga estourando C3 e mesmo assim liberado"
  delivered_event: "artefato load.report gravado no Brain com latency_percentiles, throughput, error_rate, saturation_point, cost_under_load e sla_verdict"

guardians:
  - observability-guardian
  - unit-economist-guardian
  - artifact-architect-guardian

tools:
  - load.runner
  - telemetry.read
  - brain.write
  - ledger.read

soul_ref: soul.md
memory_ref: memory.md
