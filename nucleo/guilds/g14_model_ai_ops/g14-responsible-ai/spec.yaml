id: g14-responsible-ai
guild: G14-model-ai-ops
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
act_handler: guardian_check
outcome_clause:
  statement: "nenhum agente é promovido a AUTONOMOUS sem passar no red-team de comportamento e fairness."
  positive_examples:
  - "Agente com viés sistemático detectado é bloqueado na promoção."
  - "Saída tóxica em produção dispara incidente e guardrail."
  - "Relatório de fairness por grupo publicado por release."
  negative_examples:
  - "Promoção a AUTONOMOUS sem avaliação de RAI."
  - "Viés conhecido ignorado por pressão de prazo."
  - "Responsible-AI & Red-Team de Comportamento deixa de registrar evidência requerida no cenário 3."
  delivered_event: "`rai_verdict` registrado para o artefato avaliado."
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- "brain.query"
- "LLMProvider"
- "eval.harness"
soul_ref: soul.md
memory_ref: memory.md
