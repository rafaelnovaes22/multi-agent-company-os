id: g3-incident-responder
guild: G03-engenharia
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
act_handler: spec_executor
# VERIFY-IN-EVAL (F4b): natureza ESTRUTURAL/dry-run. O oráculo (oracle.structure, HELD-OUT no
# eval-case; o agente nunca o vê) verifica a COMPLETUDE/CONSISTÊNCIA do postmortem via
# verify_structure — SEM execução: campos obrigatórios, timeline monotônica, MTTA/MTTR numéricos
# (mtta≤mttr), rollback com passos, follow-ups com owner, sem placeholders. delivered_event (C2,
# regra hard) é MANTIDO. NÃO há delivered_when automatizável: delivered_ok é SEMPRE False
# (ASSISTED, garantia PARCIAL) — estrutura é necessária-não-suficiente e "mitigated" é estado do
# mundo, fora do predicado; humano revisa o conteúdo e a mitigação real. Offline só static_ok move.
outcome_clause:
  statement: 'Respondedor de Incidentes entrega incident_responder.artifact verificável
    para: triar, mitigar e fechar o loop de incidentes de produção minimizando impacto
    ao cliente e ao north-star.'
  positive_examples:
  - Recebe input válido e publica incident_responder.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g3-incident-responder.delivered == true and artifact_type == 'incident_responder.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
- security-privacy-guardian
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
