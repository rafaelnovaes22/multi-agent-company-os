id: g5-fraud-abuse-detector
guild: G05-seguranca-compliance
ledger: operating
tier: L2
ai_enabled: true
model_role: guardian
mode: SHADOW
act_handler: guardian_check
outcome_clause:
  statement: 'Fraud & Abuse Detector entrega fraud_abuse_detector.artifact verificável
    para: detectar fraude e abuso transacional e account takeover em tempo quase-real,
    protegendo a receita e a confiança na plataforma (sinais configuráveis quando
    o mercado for definido).'
  positive_examples:
  - Recebe input válido e publica fraud_abuse_detector.artifact com status ready e
    evidência rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g5-fraud-abuse-detector.delivered == true and artifact_type ==
    'fraud_abuse_detector.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- security-privacy-guardian
- observability-guardian
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
