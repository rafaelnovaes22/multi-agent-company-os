id: g3-frontend-builder
guild: G03-engenharia
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
act_handler: spec_executor
# VERIFY-IN-EVAL (F3a-2): natureza BUILD do oráculo code-exec com runtime=node (vitest) — os
# testes são HELD-OUT (oracle.heldout_files, autorados no eval-case; o agente nunca os vê) e
# injetados por cima do artefato na execução. Verifica a LÓGICA de UI (carrinho/formatação/
# validação/reducer) headless; o gate visual "lovable/taste" é F4 (browser-exec), não aqui.
# delivered_event (C2, regra hard) é MANTIDO; delivered_when adiciona o predicado verificável.
# OFFLINE só static_ok move; delivered_ok exige execução real (vitest, F2).
delivered_when: static_ok and tests_pass
outcome_clause:
  statement: 'Construtor de Frontend entrega frontend_builder.artifact verificável
    para: implementar a UI a partir do plano e dos contratos, atingindo o gate de
    taste "lovable" antes de entregar.'
  positive_examples:
  - Recebe input válido e publica frontend_builder.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g3-frontend-builder.delivered == true and artifact_type == 'frontend_builder.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
