id: g11-recruiter-sourcer
guild: G11-pessoas-conhecimento
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: true
act_handler: slope_score

outcome_clause:
  statement: "Entregar uma short-list de candidatos qualificados por Slope Score que avancem para entrevista, dentro do orçamento de sourcing."
  positive_examples:
    - "Short-list de 5 ex-fundadores com Slope Score e evidências, 3 aceitam conversar."
    - "Candidato sourced inbound (via founder brand) convertido em entrevista sem custo pago."
    - "Pipeline limpo permite ao scheduler agendar sem reclassificação."
  negative_examples:
    - "Lista de 50 perfis genéricos por palavra-chave de cargo, sem sinal de slope."
    - "Abordagem a quem deu opt-out ou armazenamento de PII fora do vault (violação LGPD)."
    - "Short-list entregue sem citação de fonte dos sinais."
  delivered_event: "shortlist.published && candidate.count_qualified >= target"

guardians:
  - po-guardian
  - security-privacy-guardian
  - unit-economist-guardian
  - artifact-architect-guardian

tools:
  - web.search
  - web.fetch
  - MessagingProvider
  - brain.query
  - brain.write
  - LLMProvider
  - pii.vault

soul_ref: soul.md
memory_ref: memory.md
