id: g14-model-router
guild: G14-model-ai-ops
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
multi_tenant: false
act_handler: model_routing_decision

outcome_clause:
  statement: "Cada chamada usa o modelo mais barato que atende o SLA de qualidade da tarefa, com fallback transparente entre providers e model_id + custo registrados no Brain."
  positive_examples:
    - "Provider primário cai e o fallback responde sem o agente perceber"
    - "Tarefa simples é roteada para modelo barato; tarefa crítica para o modelo forte"
    - "Chamada billable que excederia C3 é bloqueada/rebaixada de modelo"
  negative_examples:
    - "Tudo roteado para o modelo mais caro por padrão"
    - "Fallback inexistente derruba a frota quando um provider falha"
    - "Chamada registrada sem model_id nem custo no Brain"
  delivered_event: "resposta retornada com model_id + cost registrados no Brain"

guardians:
  - artifact-architect-guardian
  - unit-economist-guardian
  - observability-guardian

tools:
  - LLMProvider
  - model.registry
  - brain.write

soul_ref: soul.md
memory_ref: memory.md
