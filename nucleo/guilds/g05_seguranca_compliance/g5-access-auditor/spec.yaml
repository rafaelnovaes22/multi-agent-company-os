id: g5-access-auditor
guild: G05-seguranca-compliance
ledger: operating
tier: L2
ai_enabled: true
model_role: guardian
mode: SHADOW
target_mode: AUTONOMOUS
act_handler: guardian_check
outcome_clause:
  statement: 'Access Auditor entrega access_auditor.artifact verificável para: revisar
    permissões e IAM de humanos e agentes, garantindo least-privilege e ausência de
    acessos órfãos ou excessivos.'
  positive_examples:
  - Recebe input válido e publica access_auditor.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g5-access-auditor.delivered == true and artifact_type == 'access_auditor.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- security-privacy-guardian
- observability-guardian
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
