id: g4-eval-harness-runner
guild: G04-qualidade-eval
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
multi_tenant: false
act_handler: eval_pass_at_k

outcome_clause:
  statement: "Todo run produz pass@k e pass-rate por categoria com graders aplicados e evidência reproduzível por case."
  positive_examples:
    - "Suíte de 32 cases rodada com pass@3, relatório com pass-rate 88% e custo médio por case"
    - "Grader rubric LLM-as-judge (modelo independente do de produção) aplicado e citado"
    - "Smoke-eval de 8 cases entregue em segundos para um micro-release diário"
  negative_examples:
    - "Run sem trace_id propagado (não conta como auditável, C6)"
    - "Pass@k reportado sem aplicar o grader correto por case"
    - "Dois runs idênticos produzindo relatórios divergentes (não-determinismo não controlado)"
  delivered_event: "artefato eval.run gravado no Brain com pass_at_k, pass_rate_by_category, grader_results[] e trace_id"

guardians:
  - observability-guardian
  - unit-economist-guardian
  - artifact-architect-guardian

tools:
  - agent.invoke
  - brain.query
  - brain.write
  - LLMProvider
  - telemetry.trace
  - sandbox.run

soul_ref: soul.md
memory_ref: memory.md
