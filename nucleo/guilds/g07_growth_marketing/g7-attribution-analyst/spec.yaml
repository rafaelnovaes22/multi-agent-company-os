id: g7-attribution-analyst
guild: G07-growth-marketing
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
multi_tenant: true
act_handler: attribution_cac_payback

outcome_clause:
  statement: "Entrega modelo de atribuição multitouch reconciliado com a fonte de verdade de G6, com CAC/payback por canal, que orienta a realocação de verba para os canais de maior ROI sob a regra delight > pago."
  positive_examples:
    - "Modelo de atribuição reconciliado com a fonte de verdade de G6"
    - "Recomendação de realocação que sobe o ROI agregado de growth"
    - "Double-counting de canal detectado e corrigido"
  negative_examples:
    - "Atribuição que não fecha com os totais de G6"
    - "Relatório sem CAC/payback por canal"
    - "Recomendação que viola a regra delight > pago"
  delivered_event: "attribution.model.v_bumped && reconciliation.passed publicado no Brain"

guardians:
  - observability-guardian
  - unit-economist-guardian
  - security-privacy-guardian
  - artifact-architect-guardian

tools:
  - metrics.read
  - nl2sql
  - brain.query
  - brain.write
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
