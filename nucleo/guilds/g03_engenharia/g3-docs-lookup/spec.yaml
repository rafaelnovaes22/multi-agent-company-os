id: g3-docs-lookup
guild: G03-engenharia
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
act_handler: docs_lookup
outcome_clause:
  statement: 'Pesquisador de Referência e Docs entrega docs_lookup.artifact verificável
    para: fornecer referência precisa e citada de APIs, libs e padrões para acelerar
    e corrigir o trabalho dos builders.'
  positive_examples:
  - Recebe input válido e publica docs_lookup.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g3-docs-lookup.delivered == true and artifact_type == 'docs_lookup.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
