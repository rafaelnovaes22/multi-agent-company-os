id: g6-forecaster
guild: G06-dados-analytics
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: true
act_handler: demand_revenue_forecast

outcome_clause:
  statement: "Cada ciclo de forecast entrega previsões com incerteza quantificada (intervalo de confiança e cenários) e acurácia rastreável por backtest, sobre as métricas canônicas do semantic layer."
  positive_examples:
    - "Entregou forecast de receita do trimestre com IC e cenários, adotado pelo FP&A."
    - "Backtest mostrou MAPE dentro da meta e a previsão foi aprovada pelo DRI."
    - "Ajustou a previsão para um lançamento tier-1 e acertou o pico de demanda."
  negative_examples:
    - "Publicou previsão pontual sem intervalo de confiança, induzindo overcommit de capacidade."
    - "Ignorou sazonalidade e errou o forecast de demanda por larga margem."
    - "Não recalibrou após drift e seguiu prevendo com MAPE alto."
  delivered_event: "forecast.emitted && backtest.accuracy_reported"

guardians:
  - unit-economist-guardian
  - observability-guardian
  - eval-engineer-guardian
  - po-guardian

tools:
  - brain.query
  - brain.write
  - MLProvider
  - StatsProvider
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
