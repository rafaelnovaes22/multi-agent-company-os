id: g12-litigation-tracker
guild: G12-juridico
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
multi_tenant: true
act_handler: provision_estimate

outcome_clause:
  statement: "Toda disputa/notificação é registrada com prazos monitorados e exposição estimada, sem prazo perdido."
  positive_examples:
    - "Notificação extrajudicial registrada e respondida dentro do prazo."
    - "Provisão de caso estimada e repassada a Finanças."
    - "Padrão de disputa recorrente vira atualização de playbook contratual."
  negative_examples:
    - "Prazo processual perdido por falta de alerta."
    - "Caso ativo sem estimativa de exposição financeira."
    - "Notificação recebida e não registrada no Brain."
  delivered_event: "dispute.registered && dispute.deadlines_tracked"

guardians:
  - po-guardian
  - observability-guardian
  - security-privacy-guardian

tools:
  - brain.query
  - brain.write
  - calendar.read
  - doc.parse
  - notify
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
