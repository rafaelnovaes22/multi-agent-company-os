id: g4-regression-watcher
guild: G04-qualidade-eval
ledger: operating
tier: L1
ai_enabled: true
model_role: guardian
mode: SHADOW
act_handler: guardian_check
outcome_clause:
  statement: 'Vigia de Regressões entrega regression_watcher.artifact verificável
    para: detectar qualquer degradação de comportamento, qualidade ou custo entre
    releases antes que ela chegue ao usuário.'
  positive_examples:
  - Recebe input válido e publica regression_watcher.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g4-regression-watcher.delivered == true and artifact_type == 'regression_watcher.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- eval-engineer-guardian
- observability-guardian
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
