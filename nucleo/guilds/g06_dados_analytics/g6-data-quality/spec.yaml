id: g6-data-quality
guild: G06-dados-analytics
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
act_handler: guardian_check
outcome_clause:
  statement: 'Qualidade & Contratos de Dados entrega data-quality.verdict verificável
    para: garantir que os dados do Company Brain sejam corretos, completos e dentro
    de contrato — sem dado bom, não há analytics confiável'
  positive_examples:
  - Bloqueou a publicação de uma tabela com 4% de duplicatas e abriu evento de quebra
    de contrato
  - Validou freshness e integridade referencial e liberou o dataset para consumo
  - Detectou PII inesperada num campo e acionou o lgpd-privacy antes do load
  negative_examples:
  - Liberou dataset com chave duplicada que inflou a north-star
  - Não detectou drift de distribuição que quebrou o churn-predictor a jusante
  - Aprovou dados com freshness fora de SLA sem sinalizar
  delivered_event: dataquality.suite_passed && dataset.contract_certified
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- brain.query
- brain.write
- DataWarehouseProvider
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
