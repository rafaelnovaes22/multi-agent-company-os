id: g6-drift-detector
guild: G06-dados-analytics
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
multi_tenant: true
act_handler: drift_check

outcome_clause:
  statement: "Drift confirmado em qualquer dimensão (quality, cost, volume, prompt) gera sinal de rebaixamento de modo dentro do ciclo de auditoria, comparado contra a baseline de promoção."
  positive_examples:
    - "Detectou queda de 6pp de acurácia/mês num agente AUTONOMOUS e o rebaixou para ASSISTED."
    - "Flagou prompt_hash alterado sem recálculo de economia e bloqueou até reauditoria."
    - "Reportou aumento de 18% de custo/mês de um agente ao margin-watch e à Governança."
  negative_examples:
    - "Deixou um agente AUTONOMOUS degradar de qualidade sem rebaixar o modo."
    - "Confundiu drift lento com anomalia pontual, duplicando o trabalho do anomaly-detector."
    - "Não associou o drift à baseline de promoção, gerando sinal não acionável."
  delivered_event: "drift.confirmed && mode.demotion_signaled"

guardians:
  - observability-guardian
  - unit-economist-guardian
  - security-privacy-guardian
  - eval-engineer-guardian

tools:
  - brain.query
  - brain.write
  - MessagingProvider
  - MLProvider

soul_ref: soul.md
memory_ref: memory.md
