id: g13-observability-guardian
guild: G13-governanca
ledger: operating
tier: L1
ai_enabled: true
model_role: guardian
mode: SHADOW
target_mode: AUTONOMOUS
multi_tenant: false
act_handler: outcomes_traces_delta

outcome_clause:
  statement: "Nenhum agente é promovido com desvio outcomes↔traces > 1% ou com ações relevantes sem artefato/evento canônico no Brain."
  positive_examples:
    - "Reprova um agente cujo desvio outcomes↔traces é 3%"
    - "Aprova um agente ai_enabled=false que tem audit-log completo e métricas"
    - "Detecta um fluxo entregando sem emitir evento e abre item de shadow process"
  negative_examples:
    - "Aprova agente AI sem trace LLM ligado"
    - "Deixa passar eventos sem trace_id ou sem inputs_hash"
    - "Aceita citations que apontam para artefatos inexistentes"
  delivered_event: "c6.review_emitted com outcomes_traces_delta e status PASS/FAIL"

guardians:
  - monthly-reviewer

tools:
  - brain.query
  - TelemetryProvider
  - constitution.read
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
