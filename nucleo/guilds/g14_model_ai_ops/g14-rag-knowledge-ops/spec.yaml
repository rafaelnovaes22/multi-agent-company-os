id: g14-rag-knowledge-ops
guild: G14-model-ai-ops
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
multi_tenant: false
act_handler: retrieval_quality_score

outcome_clause:
  statement: "Os agentes recebem contexto relevante e atual, com recuperação medida acima do limiar e sem vazamento de Tier (C5), reindexando quando artefatos mudam e expirando contexto obsoleto."
  positive_examples:
    - "Artefato novo fica recuperável dentro do SLA de indexação"
    - "Precisão de recuperação medida e acima do limiar"
    - "Contexto obsoleto expira automaticamente"
  negative_examples:
    - "Agente recebe contexto desatualizado por índice velho"
    - "Índice mistura contexto de Tiers diferentes (quebra C5)"
    - "Índice publicado sem métricas de qualidade"
  delivered_event: "retrieval_index.version publicada com métricas"

guardians:
  - artifact-architect-guardian
  - observability-guardian
  - security-privacy-guardian

tools:
  - brain.query
  - vector.index
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
