id: g14-model-eval-bench
guild: G14-model-ai-ops
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: false
act_handler: model_scorecard

outcome_clause:
  statement: "Nenhum modelo entra em produção sem scorecard comparativo (qualidade/custo/latência) contra golden datasets e estimativa econômica (C3), recomendando adotar ou reverter."
  positive_examples:
    - "Modelo novo supera o atual em custo/qualidade e é adotado com evidência"
    - "Upgrade que regride qualidade é rejeitado/revertido"
    - "Impacto C3 estimado antes da adoção"
  negative_examples:
    - "Troca de modelo no escuro sem benchmark"
    - "Regressão só descoberta por usuário em produção"
    - "Adoção sem estimativa de custo (C3)"
  delivered_event: "model_scorecard.published == true"

guardians:
  - eval-engineer-guardian
  - unit-economist-guardian
  - observability-guardian

tools:
  - LLMProvider
  - eval.harness
  - dataset.registry
  - brain.write

soul_ref: soul.md
memory_ref: memory.md
