id: g14-model-eval-bench
guild: G14-model-ai-ops
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
act_handler: guardian_check
outcome_clause:
  statement: "nenhum modelo entra em produção sem scorecard comparativo e estimativa econômica."
  positive_examples:
  - "Modelo novo supera o atual em custo/qualidade e é adotado com evidência."
  - "Upgrade que regride qualidade é rejeitado/revertido."
  - "Impacto C3 estimado antes da adoção."
  negative_examples:
  - "Troca de modelo \"no escuro\" sem benchmark."
  - "Regressão só descoberta por usuário em produção."
  - "Benchmark de Modelos deixa de registrar evidência requerida no cenário 3."
  delivered_event: "`model_scorecard.published == true`."
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- "LLMProvider"
- "eval.harness"
- "dataset.registry"
- "brain.write"
soul_ref: soul.md
memory_ref: memory.md
