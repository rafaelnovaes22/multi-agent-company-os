id: g12-risk-register
guild: G12-juridico
ledger: operating
tier: L1
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: true
act_handler: risk_score

outcome_clause:
  statement: "Todo risco corporativo material está registrado, classificado, com dono e mitigação monitorada."
  positive_examples:
    - "Incidente de privacidade convertido em item de risco com dono e mitigação."
    - "Risco que muda para 'vermelho' dispara alerta ao DRI/board."
    - "Heatmap de risco entregue como insumo do deck de board."
  negative_examples:
    - "Risco material conhecido por uma guilda mas ausente do register."
    - "Risco vermelho sem dono atribuído."
    - "Mitigação vencida sem alerta nem reavaliação."
  delivered_event: "risk.registered && risk.owner_assigned && risk.scored"

guardians:
  - po-guardian
  - observability-guardian
  - security-privacy-guardian

tools:
  - brain.query
  - brain.write
  - scheduler
  - notify
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
