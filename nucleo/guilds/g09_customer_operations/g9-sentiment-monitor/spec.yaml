id: g9-sentiment-monitor
guild: G09-customer-operations
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
multi_tenant: true
act_handler: sentiment_score

outcome_clause:
  statement: "Sinaliza deterioração de sentimento e risco de crise antes do impacto, com tendência confiável por cliente, fila, canal e segmento, sem fadiga de alerta."
  positive_examples:
    - "Queda de sentimento numa conta-chave detectada e marcada para retenção antes do churn"
    - "Pico negativo em canal público alertado a Growth/Comunicação em minutos"
    - "Feature de sentimento entregue ao churn-predictor melhora a previsão"
  negative_examples:
    - "Marca como negativo um texto sarcástico/positivo (falso positivo em escala)"
    - "Perde uma crise emergente em canal público"
    - "Gera alertas em excesso e satura o time (fadiga de alerta)"
  delivered_event: "sentiment.scored no stream e sentiment.alert_raised quando threshold cruzado, no Brain"

guardians:
  - observability-guardian
  - security-privacy-guardian
  - po-guardian

tools:
  - brain.query
  - brain.emit
  - LLMProvider
  - stream.subscribe
  - MessagingProvider

soul_ref: soul.md
memory_ref: memory.md
