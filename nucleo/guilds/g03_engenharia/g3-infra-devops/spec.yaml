id: g3-infra-devops
guild: G03-engenharia
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
act_handler: spec_executor
# VERIFY-IN-EVAL (F4a): natureza OPS/DRY-RUN do oráculo code-exec com runtime=terraform. O
# critério é HELD-OUT (oracle.heldout_files = .tftest.hcl autorado no eval-case; o agente nunca
# o vê) e injetado por cima na execução: `terraform init -backend=false && validate && test`
# (command=plan, múltiplos inputs barram hardcode). Verifica a LÓGICA de configuração (locals/
# outputs/funções) — SEM providers de cloud (sem rede, determinístico). "plan ≠ apply": o
# oráculo NUNCA aplica; prova plan-válido, não apply-correto-em-produção — por isso o agente
# segue ASSISTED (garantia PARCIAL: humano revisa o plan real antes do apply).
# delivered_event (C2, regra hard) é MANTIDO; delivered_when adiciona o predicado verificável.
# OFFLINE só static_ok move; delivered_ok exige execução real (terraform, F2/nightly).
delivered_when: static_ok and tests_pass
outcome_clause:
  statement: 'Infra & DevOps entrega infra_devops.artifact verificável para: prover
    infraestrutura como código, pipelines de CI/CD e deploys confiáveis e reversíveis.'
  positive_examples:
  - Recebe input válido e publica infra_devops.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g3-infra-devops.delivered == true and artifact_type == 'infra_devops.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
