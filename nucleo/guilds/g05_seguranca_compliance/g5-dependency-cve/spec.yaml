id: g5-dependency-cve
guild: G05-seguranca-compliance
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
multi_tenant: false
act_handler: cve_prioritization

outcome_clause:
  statement: "Nenhuma CVE explorável em caminho ativo permanece sem remediação ou mitigação dentro do SLA da sua severidade."
  positive_examples:
    - "Prioriza CVE com exploit público em caminho ativo e dispara patch no SLA."
    - "Bloqueia build que reintroduz versão vulnerável já embargada."
    - "Detecta pacote com typosquatting e barra sua entrada."
  negative_examples:
    - "CVE crítica exposta fica sem remediação além do SLA."
    - "Inunda G3 com bumps de CVEs irrelevantes (sem priorização por exposição)."
    - "Pacote malicioso entra no lockfile sem alerta."
  delivered_event: "cve.scan_completed emitido (sem CVE crítica aberta) ou cve.remediation_dispatched com versão-alvo."

guardians:
  - security-privacy-guardian
  - observability-guardian
  - artifact-architect-guardian

tools:
  - repo.read
  - brain.query
  - brain.write
  - cve.feed
  - ci.run
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
