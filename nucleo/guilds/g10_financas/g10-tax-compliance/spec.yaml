id: g10-tax-compliance
guild: G10-financas
ledger: operating
tier: L1
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: true
act_handler: fin_tax_assessment

outcome_clause:
  statement: "Todas as obrigações tributárias do período são apuradas e cumpridas no prazo legal, com a base legal de cada parâmetro registrada e auditável, mantendo regime e alíquotas configuráveis (jurisdição BR)."
  positive_examples:
    - "Apuração e guias geradas e pagas dentro do prazo para 100% dos tributos do período"
    - "Mudança de alíquota refletida por configuração com base legal linkada antes da próxima apuração"
    - "Tributos apurados conciliados com documentos fiscais sem divergência"
  negative_examples:
    - "Aplicou alíquota desatualizada por não captar mudança regulatória"
    - "Hardcode de alíquota no fluxo em vez de parâmetro configurável (viola C8)"
    - "Obrigação acessória entregue fora do prazo, gerando multa"
  delivered_event: "tax.assessment publicado no Brain com payment_guide emitida e due_date cumprido, base legal referenciada"

guardians:
  - po-guardian
  - tenant-context-curator-guardian
  - security-privacy-guardian
  - observability-guardian

tools:
  - TaxFilingProvider
  - ledger.read
  - brain.query
  - brain.write
  - MessagingProvider
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
