id: g4-quality-gate
guild: G04-qualidade-eval
ledger: operating
tier: L1
ai_enabled: true
model_role: guardian
mode: SHADOW
multi_tenant: false
act_handler: quality_gate_decision

outcome_clause:
  statement: "Todo merge/release-candidate recebe um gate-result determinístico que bloqueia o que está abaixo do padrão (técnico e de lovability) com motivo citável."
  positive_examples:
    - "Merge bloqueado por cobertura 74% (< 80%) com arquivo e linhas faltantes listados"
    - "Release verde nos testes porém bloqueado por gate de lovability com 3 pontos de taste"
    - "Bypass de incidente aceito e registrado no Brain para auditoria"
  negative_examples:
    - "Merge liberado com E2E vermelho"
    - "Gate aprovando output que passa nos testes mas é claramente não-lovable"
    - "Bypass aplicado sem registro auditável"
  delivered_event: "artefato gate.result gravado no Brain com decision, criteria[] (cada um PASS/FAIL), lovability e candidate_id"

guardians:
  - po-guardian
  - artifact-architect-guardian
  - unit-economist-guardian
  - security-privacy-guardian

tools:
  - repo.read
  - brain.query
  - brain.write
  - ci.gate
  - policy.read

soul_ref: soul.md
memory_ref: memory.md
