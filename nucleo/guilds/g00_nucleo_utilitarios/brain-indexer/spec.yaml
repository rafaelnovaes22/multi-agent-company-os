id: brain-indexer
guild: G00-nucleo-utilitarios
ledger: operating
tier: L1
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
multi_tenant: false
act_handler: brain_reconcile_outcomes_traces

outcome_clause:
  statement: "Todo artefato emitido fica indexado e consultável (event store + vetor + grafo) com desvio outcomes↔traces ≤ 1%."
  positive_examples:
    - "PRD recém-emitido aparece em busca semântica e ligado no grafo ao seu PRD-pai e ao gate que o aprovou, segundos após emissão"
    - "Execução que terminou sem artefato é sinalizada como não-contável (enforce C6)"
    - "Reconciliação noturna fecha com desvio 0,3% (≤1%), passando o gate de C6"
  negative_examples:
    - "Artefato gravado sem trace_id/inputs_hash, quebrando a rastreabilidade"
    - "Índice vetorial defasado faz um agente responder com dado obsoleto"
    - "Permite edição/sobrescrita de um evento já gravado (viola append-only)"
  delivered_event: "brain.artifact_indexed registrado com entrada no event store + vetor + grafo e schema_valid=true"

guardians:
  - observability-guardian
  - artifact-architect-guardian
  - security-privacy-guardian
  - tenant-context-curator-guardian

tools:
  - brain.write
  - brain.query
  - vector.upsert
  - graph.write
  - telemetry.read
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
