id: g1-okr-steward
guild: G01-estrategia-founder-office
ledger: operating
tier: L1
ai_enabled: true
model_role: worker
mode: SHADOW
multi_tenant: true
act_handler: northstar_daily_value

outcome_clause:
  statement: "Cada guilda tem OKRs mensuráveis amarrados ao Brain e a north-star é publicada diariamente com fórmula auditável."
  positive_examples:
    - "North-star calculada e publicada todo dia com fórmula versionada"
    - "KR em risco alertado antes do fim do ciclo, com replanejamento proposto"
    - "Referral Propensity Score instrumentado como KR de growth"
  negative_examples:
    - "KR sem métrica observável ou sem dono"
    - "North-star sem fórmula documentada ou com coleta quebrada por dias"
    - "OKR redigido fixando uma métrica específica de um vertical ainda indefinido"
  delivered_event: "okr.scorecard é atualizado e northstar.daily_value do dia é persistido no Brain com northstar.definition vinculada"

guardians:
  - po-guardian
  - observability-guardian
  - artifact-architect-guardian
  - unit-economist-guardian

tools:
  - brain.query
  - brain.write
  - metrics.read
  - dashboard.publish
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
