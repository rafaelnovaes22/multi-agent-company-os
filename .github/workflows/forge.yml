name: forge-gate

# Gate de QUALIDADE da Fábrica, não-bypassável: roda em todo PR e push para main.
# Torna a "definition of done" (AGENTS.md) executável no CI — não depende de o agente lembrar.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  forge:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # pre_pr_gate compara o branch vs origin/main (precisa do histórico)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q nucleo
      - name: Pre-PR gate (proveniência + prova independente — HARD-FAIL, escopado ao diff)
        # Reprova o PR que fecha capacidade sem prova independente (regra de ouro #4, AGENTS.md).
        # Escopado aos agentes mudados vs origin/main — NÃO --fleet (o backlog da frota
        # queima PR a PR; --fleet no PR travaria todo merge, inclusive os de retrofit).
        run: python -m nucleo.quality.pre_pr_gate
      - name: Tripwire de homogeneidade de diff (gaming em massa — ADVISORY, dispara revisão)
        # NÃO bloqueia merge: é heurística sobre a forma do ataque histórico (#30-32, #66-80) e
        # espera-se evasão por jitter (item 4 de docs/PLANO-AJUSTE-ROTA.md). Sai !=0 p/ anotar o
        # PR e levar um humano a olhar; continue-on-error mantém o gate de mérito no pre_pr_gate.
        continue-on-error: true
        run: python -m nucleo.quality.diff_homogeneity
      - name: Forge check (definition-of-done, ratchet)
        run: python -m nucleo.quality.forge_check
      - name: Eval-harness da frota (C4)
        run: |
          rm -rf nucleo/.brain* .brain*
          python -m nucleo.demo_eval
      - name: AgentShield (C8 — sem HIGH)
        run: |
          rm -rf nucleo/.brain* .brain*
          python -m nucleo.demo_agentshield
      - name: Guarda de ICP
        run: python -m unittest tests.test_icp_segments
      - name: Wiring da camada generativa (soul + C2 + custo + opt-in)
        run: python -m unittest tests.test_generative_prompt
      - name: Oráculo VERIFY-IN-EVAL F0 (verify_code + spec_executor)
        run: python -m unittest tests.test_verify_code
      - name: Relatório VERIFY-IN-EVAL F5 (contrato JSON + crédito de execução)
        run: python -m unittest tests.test_exec_report
      - name: Seam de execução VERIFY-IN-EVAL F1 (ExecutionProvider inerte)
        run: python -m unittest tests.test_execution
      - name: VERIFY-IN-EVAL naturezas held-out (build backend/frontend + ops terraform/incident/browser)
        run: |
          python -m unittest tests.test_verify_heldout
          python -m unittest tests.test_verify_frontend
          python -m unittest tests.test_verify_terraform
          python -m unittest tests.test_verify_incident
          python -m unittest tests.test_verify_browser
      - name: Resiliência operacional (demoção sem gate + kill-switch de frota)
        run: python -m unittest tests.test_demotion_killswitch
      - name: Least-privilege de tools (ToolBox observe/enforce)
        run: python -m unittest tests.test_toolbox
      - name: Tripwire de homogeneidade (sinais A/B pegam carimbo em massa e casos-clone)
        run: python -m unittest tests.test_diff_homogeneity
      - name: Suite SECURITY da frota (red-team como regressão; 100% obrigatório)
        run: |
          python -m nucleo.quality.security_eval
          python -m unittest tests.test_security_evals
      - name: Red-team determinístico (mutação de ataques, offline; harness honesto)
        run: |
          python -m nucleo.quality.redteam -k 0
          python -m unittest tests.test_redteam
