id: g9-dispute-mediator
guild: G09-customer-operations
ledger: billable
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
act_handler: dispute_mediator_c3
outcome_clause:
  statement: 'Mediador de Disputas (genérico) entrega dispute-mediator.artifact verificável
    para: mediar disputas entre partes de uma transação de forma justa, documentada
    e dentro da política, fechando o caso com uma resolução aceita'
  positive_examples:
  - Disputa resolvida com reentrega aceita por ambas as partes e dossiê completo
  - Caso de alto valor pausado no gate humano antes da decisão
  - Padrão de disputa recorrente reportado a Produto para correção de raiz
  negative_examples:
  - Decide a favor de uma parte sem evidência registrada
  - Executa resolução de alto valor sem gate humano
  - Fecha a disputa sem aceite ou sem trilha de auditoria
  delivered_event: dispute.resolved (pós-gate quando exigido) com auditoria no Brain
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- unit-economist
- artifact-architect
tools:
- brain.query
- brain.emit
- MessagingProvider
- LLMProvider
- interrupt (gate humano)
- evidence.collect
soul_ref: soul.md
memory_ref: memory.md
