id: g4-test-coverage
guild: G04-qualidade-eval
ledger: operating
tier: L2
ai_enabled: true
model_role: guardian
mode: SHADOW
multi_tenant: false
act_handler: coverage_check

outcome_clause:
  statement: "Todo release-candidate tem cobertura de testes de no mínimo 80% com gaps críticos identificados antes do merge."
  positive_examples:
    - "Candidate com 84% de cobertura aprovado e gaps cosméticos listados como dívida"
    - "Caminho de tratamento de PII sem teste sinalizado como gap crítico P1"
    - "Queda de cobertura de 88%->81% entre releases sinalizada como dívida crescente"
  negative_examples:
    - "Merge liberado com 71% de cobertura"
    - "Cobertura verde aceita em linhas executadas sem nenhuma asserção"
    - "Gap em caminho crítico tratado como cosmético"
  delivered_event: "artefato coverage.report gravado no Brain com coverage_pct >= threshold ou FAIL, critical_gaps[] e candidate_id"

guardians:
  - artifact-architect-guardian
  - security-privacy-guardian
  - observability-guardian

tools:
  - ci.coverage
  - repo.read
  - brain.write

soul_ref: soul.md
memory_ref: memory.md
