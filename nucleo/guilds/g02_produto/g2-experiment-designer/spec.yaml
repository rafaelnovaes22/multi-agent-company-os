id: g2-experiment-designer
guild: G02-produto-discovery
ledger: operating
tier: L1
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: true
act_handler: experiment_sample_size

outcome_clause:
  statement: "Todo experimento tem critério de sucesso e tamanho de amostra pré-registrados antes do start, e decisão (ship/kill/iterar) ao fim."
  positive_examples:
    - "A/B com métrica primária, guardrails e n calculado antes de ligar."
    - "Resultado lido com IC 95% e decisão registrada."
    - "Experimento subdimensionado -> não inicia até instrumentação/amostra adequadas."
  negative_examples:
    - "Decisão de sucesso definida depois de olhar os números."
    - "Experimento sem métrica guardrail (risco de otimizar localmente e piorar o todo)."
    - "Conclusão 'deu bom' sem significância estatística."
  delivered_event: "evento experiment.design.committed é gravado com critério de sucesso pré-registrado e n calculado."

guardians:
  - po-guardian
  - observability-guardian
  - unit-economist-guardian

tools:
  - brain.query
  - brain.write
  - ExperimentationProvider
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
