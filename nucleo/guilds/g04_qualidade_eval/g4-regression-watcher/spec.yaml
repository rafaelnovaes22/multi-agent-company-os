id: g4-regression-watcher
guild: G04-qualidade-eval
ledger: operating
tier: L1
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: false
act_handler: regression_drift

outcome_clause:
  statement: "Toda regressão de qualidade/custo entre releases é detectada, atribuída a uma causa provável e convertida em eval-case antes de afetar o usuário."
  positive_examples:
    - "Queda de 7pp no pass-rate de uma categoria detectada e atribuída a um commit específico"
    - "Drift de custo de 1.2x sinalizado como WARN para um output BL sob C3"
    - "Regressão confirmada vira novo eval-case adversarial"
  negative_examples:
    - "Regressão só descoberta por reclamação de usuário em produção"
    - "Alarme falso disparado por variação dentro do ruído estatístico"
    - "Regressão confirmada sem issue acionável nem novo case"
  delivered_event: "artefato regression.report gravado no Brain com delta_vs_baseline, suspected_cause, severity e (se confirmada) linked_case_id"

guardians:
  - observability-guardian
  - unit-economist-guardian
  - po-guardian
  - artifact-architect-guardian

tools:
  - brain.query
  - repo.read
  - telemetry.read
  - issue.create
  - agent.invoke

soul_ref: soul.md
memory_ref: memory.md
