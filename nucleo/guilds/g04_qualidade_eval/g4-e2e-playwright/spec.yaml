id: g4-e2e-playwright
guild: G04-qualidade-eval
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
act_handler: spec_driven
outcome_clause:
  statement: 'Testes E2E de UI entrega e2e_playwright.artifact verificável para: validar
    de ponta a ponta os fluxos de UI que humanos usam, garantindo que a camada onde
    "o agente É a ativação" funciona de verdade.'
  positive_examples:
  - Recebe input válido e publica e2e_playwright.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g4-e2e-playwright.delivered == true and artifact_type == 'e2e_playwright.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- eval-engineer-guardian
- observability-guardian
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
