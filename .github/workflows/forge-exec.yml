name: forge-exec (nightly)

# Execução REAL (VERIFY-IN-EVAL F2) — roda código dos eval-cases num contêiner hardened.
# SEPARADO do gate forge.yml e fora de pull_request por SEGURANÇA: executa código só no main
# já mergeado/revisado, em runner Linux+Docker. Disparo: nightly (cron) + manual (dispatch).
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC diário
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-exec:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      EXEC_PROVIDER: docker
      EXEC_IMAGE: nucleo-exec:latest
      EXEC_IMAGE_NODE: nucleo-exec-node:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build imagem de execução Python (com rede; os runs depois são --network none)
        run: docker build -t nucleo-exec:latest -f nucleo/quality/exec.Dockerfile nucleo/quality
      - name: Build imagem de execução Node/vitest (build do frontend, F3a-2)
        run: docker build -t nucleo-exec-node:latest -f nucleo/quality/exec.node.Dockerfile nucleo/quality
      - name: Teste de integração do DockerExecutor (sandbox real — pytest + vitest)
        run: python -m unittest tests.test_docker_executor
      - name: Relatório de execução do piloto (humano + JSON)
        run: |
          python -m nucleo.quality.exec_report --json-output exec_report.json nucleo/guilds/g03_engenharia/g3-build-error-resolver | tee exec_report.txt
      - name: Relatório de execução do g3-backend-builder (F3, held-out)
        run: |
          python -m nucleo.quality.exec_report --json-output exec_report_backend.json nucleo/guilds/g03_engenharia/g3-backend-builder | tee exec_report_backend.txt
      - name: Relatório de execução do g3-frontend-builder (F3a-2, Node/vitest)
        run: |
          python -m nucleo.quality.exec_report --json-output exec_report_frontend.json nucleo/guilds/g03_engenharia/g3-frontend-builder | tee exec_report_frontend.txt
      - name: Publicar artefatos do relatório VERIFY-IN-EVAL
        uses: actions/upload-artifact@v4
        with:
          name: verify-in-eval-exec-report
          path: |
            exec_report.txt
            exec_report.json
            exec_report_backend.txt
            exec_report_backend.json
            exec_report_frontend.txt
            exec_report_frontend.json
