id: g3-perf-optimizer
guild: G03-engenharia
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: false
act_handler: perf_benchmark_delta

outcome_clause:
  statement: "A otimização melhora a métrica-alvo de forma comprovada por benchmark, sem regredir correção."
  positive_examples:
    - "latência p95 reduzida com benchmark antes/depois e testes verdes"
    - "N+1 eliminado, validado em teste de carga"
    - "custo de tokens de um fluxo de agente reduzido, reportado a G10"
  negative_examples:
    - "otimização no escuro sem profiling que a justifique"
    - "ganho de velocidade às custas de resultado incorreto"
    - "melhoria sem SLO registrado para travar regressão futura"
  delivered_event: "benchmark.improved && correctness.preserved"

guardians:
  - artifact-architect-guardian
  - observability-guardian
  - unit-economist-guardian

tools:
  - repo.read
  - repo.write
  - ci.run
  - observability.query
  - brain.query
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
