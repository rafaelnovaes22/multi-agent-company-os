id: g3-eng-supervisor
guild: G03-engenharia
ledger: operating
tier: L1
ai_enabled: true
model_role: supervisor
mode: SHADOW
act_handler: supervisor_route
outcome_clause:
  statement: 'Supervisor de Engenharia entrega eng_supervisor.artifact verificável
    para: decompor cada feature/spec aprovada em fases roteáveis e orquestrar os builders
    até a entrega passar nos gates.'
  positive_examples:
  - Recebe input válido e publica eng_supervisor.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g3-eng-supervisor.delivered == true and artifact_type == 'eng_supervisor.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
