id: g4-shadow-comparator
guild: G04-qualidade-eval
ledger: operating
tier: L1
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: false
act_handler: agreement_rate

outcome_clause:
  statement: "Todo agente em SHADOW recebe agreement-rate por categoria sobre amostra e janela suficientes, com recomendação clara de promover ou reter."
  positive_examples:
    - "Agente com agreement 93% sobre janela de 16 dias e amostra suficiente recomendado para PILOT"
    - "Categoria com agreement 71% isolada e enviada como gap ao case-author antes de promover"
    - "Viés sistemático (agente sempre conservador numa categoria) detectado e reportado"
  negative_examples:
    - "Recomendação de promoção com janela de SHADOW de apenas 5 dias"
    - "Agreement-rate reportado só como média global, escondendo categoria ruim"
    - "Comparação feita sobre dados de produção com PII crua (viola LGPD)"
  delivered_event: "artefato shadow.comparison gravado no Brain com agreement_rate_by_category, sample_size, shadow_window_days >= 14, bias_flags[] e recommendation"

guardians:
  - po-guardian
  - security-privacy-guardian
  - observability-guardian
  - unit-economist-guardian

tools:
  - brain.query
  - telemetry.read
  - repo.read
  - agent.invoke
  - data.anonymize

soul_ref: soul.md
memory_ref: memory.md
