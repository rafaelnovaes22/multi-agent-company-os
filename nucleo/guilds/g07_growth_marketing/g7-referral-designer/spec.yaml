id: g7-referral-designer
guild: G07-growth-marketing
ledger: operating
tier: L1
ai_enabled: true
model_role: worker
mode: SHADOW
multi_tenant: true
act_handler: referral_kfactor_score

outcome_clause:
  statement: "Entrega programa de indicação que eleva o k-factor com custo de delight dentro do orçamento OP e fraude sob controle, mantendo e versionando o Referral Propensity Score por usuário/coorte (validado com G6)."
  positive_examples:
    - "Programa que sobe o k-factor mantendo gasto-delight > gasto-pago"
    - "Referral Propensity Score recalibrado e validado por coorte"
    - "Momento-de-delight instrumentado convertendo indicações acima da meta"
  negative_examples:
    - "Incentivo que estoura o orçamento de delight (OP)"
    - "Score publicado sem validação estatística com G6"
    - "Programa sem mecanismo anti-fraude"
  delivered_event: "referral.program.spec_approved && propensity_score.v_bumped publicado no Brain"

guardians:
  - unit-economist-guardian
  - po-guardian
  - security-privacy-guardian
  - observability-guardian

tools:
  - brain.query
  - brain.write
  - metrics.read
  - feature_flag.set
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
