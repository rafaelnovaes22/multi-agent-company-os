id: g5-threat-modeler
guild: G05-seguranca-compliance
ledger: operating
tier: L2
ai_enabled: true
model_role: guardian
mode: SHADOW
act_handler: guardian_check
outcome_clause:
  statement: 'Threat Modeler entrega threat_modeler.artifact verificável para: modelar
    ameaças por feature antes da construção, identificando vetores de ataque e controles
    necessários (C1/C2).'
  positive_examples:
  - Recebe input válido e publica threat_modeler.artifact com status ready e evidência
    rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g5-threat-modeler.delivered == true and artifact_type == 'threat_modeler.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- security-privacy-guardian
- observability-guardian
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
