id: g7-ab-growth-runner
guild: G07-growth-marketing
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
multi_tenant: true
act_handler: ab_sizing_significance

outcome_clause:
  statement: "Entrega experimentos de growth com desenho válido (hipótese, métrica primária, tamanho de amostra e critério de parada definidos antes) e decisão de rollout estatisticamente fundamentada, registrando o learning no Brain."
  positive_examples:
    - "Experimento atinge significância e vencedor é promovido"
    - "Teste encerrado por critério de parada pré-definido (sem peeking)"
    - "Learning do experimento registrado para reuso (ECC)"
  negative_examples:
    - "Decisão declarada sem significância estatística"
    - "Experimento sem métrica primária/critério de parada definidos"
    - "Vencedor promovido sem leitura de G6"
  delivered_event: "experiment.concluded && significance.reached && rollout.decided publicado no Brain"

guardians:
  - po-guardian
  - observability-guardian
  - artifact-architect-guardian
  - unit-economist-guardian

tools:
  - experiment.run
  - feature_flag.set
  - metrics.read
  - brain.query
  - brain.write
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
