id: g14-inference-cost-optimizer
guild: G14-model-ai-ops
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: false
act_handler: inference_cost_savings

outcome_clause:
  statement: "Reduz o custo de inferência por outcome (cache, batching, compressão de prompt, candidatos a distilação) sem regressão de qualidade acima da tolerância, sustentando o token-max responsável."
  positive_examples:
    - "Cache aplicado corta custo de uma rota repetitiva, qualidade mantida"
    - "Tarefa simples migrada para modelo menor com economia comprovada"
    - "Economia rateada e visível por guilda"
  negative_examples:
    - "Otimização que degrada qualidade além da tolerância"
    - "Cache servindo resposta obsoleta/errada"
    - "Economia aplicada sem medição nem visibilidade por guilda"
  delivered_event: "cost_optimization.applied com economia medida e qualidade ≥ baseline"

guardians:
  - unit-economist-guardian
  - eval-engineer-guardian
  - observability-guardian

tools:
  - brain.query
  - LLMProvider
  - model.registry

soul_ref: soul.md
memory_ref: memory.md
