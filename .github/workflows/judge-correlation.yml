name: judge-correlation (F3b)

# Relatório VIVO da correlação run_evals × juiz externo (VERIFY-IN-EVAL F3b).
# Lê-se junto com foundry-exec.yml (oráculo determinístico): run_evals dá ~100% aos técnicos
# enquanto o juiz gpt-5 reprovava por "blueprint, não código" (descasamento de instrumento).
# O oráculo fecha o gap de MEDIÇÃO; a nota do juiz só sobe com capacidade generativa+execução.
# Versionar o juiz permite acompanhar essa subida no tempo, sem re-rodar ad-hoc.
#
# NÃO é gate de PR. Roda mensal + sob demanda. Dois provedores:
#   - gerador  = a frota real via Vertex (WIF, sem chave longa)   — secrets GCP_WIF_PROVIDER/GCP_SA_EMAIL
#   - juiz     = OpenAI gpt-5 (família distinta = mais independência) — secrets OPENAI_API_KEY
# Sem OPENAI_API_KEY o script sai INERTE (exit 0) — "pronto, aguardando o secret".

on:
  schedule:
    - cron: "0 7 1 * *"        # dia 1 de cada mês, 07:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "avalia só os N primeiros agentes (0 = todos; menor = mais barato)"
        default: "0"
      require_judge:
        description: "exigir o juiz (true => falha se faltar OPENAI_API_KEY)"
        default: "false"
      dump_artifacts:
        description: "incluir no JSON o artefato gerado por cada agente (diagnóstico de leak/vagueza)"
        default: "false"
      only:
        description: "avaliar só estes ids (lista separada por vírgula) — re-teste barato de um fix pontual"
        default: ""

permissions:
  contents: read
  id-token: write              # OIDC p/ Workload Identity Federation (gerador Vertex)

jobs:
  judge-correlation:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      JUDGE: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: vertex
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: novais-digital-multiagentes
      GOOGLE_CLOUD_LOCATION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai openai
      # Credencial Vertex via WIF (gerador). Os mesmos secrets do redteam.yml.
      - name: Auth GCP (Vertex AI — gerador)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - name: Relatório de correlação (juiz gpt-5; inerte se faltar OPENAI_API_KEY)
        run: |
          REQ=""
          if [ "${{ github.event.inputs.require_judge }}" = "true" ]; then REQ="--require-judge"; fi
          DUMP=""
          if [ "${{ github.event.inputs.dump_artifacts }}" = "true" ]; then DUMP="--dump-artifacts"; fi
          python -m nucleo.quality.judge_eval $REQ $DUMP \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --only "${{ github.event.inputs.only || '' }}" \
            --json-output judge_report.json | tee judge_report.txt
      - name: Publicar relatório do juiz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-in-eval-judge-report
          path: |
            judge_report.txt
            judge_report.json
          if-no-files-found: ignore
