id: g9-refund-handler
guild: G09-customer-operations
ledger: billable
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
multi_tenant: true
act_handler: refund_eligibility

outcome_clause:
  statement: "Processa cada reembolso conforme a política, com gate humano obrigatório antes de qualquer movimentação financeira e auditoria completa do motivo e da aprovação."
  positive_examples:
    - "Reembolso elegível recomendado, aprovado no gate e executado com confirmação ao cliente"
    - "Pedido com indício de abuso flagado a fraude antes de qualquer pagamento"
    - "Caso fora de política recusado com justificativa registrada e comunicada com empatia"
  negative_examples:
    - "Executa reembolso sem passar pelo gate humano"
    - "Aprova valor acima do elegível pela política"
    - "Conclui sem trilha de auditoria do motivo e da aprovação"
  delivered_event: "refund.executed (pós-gate) ou refund.denied com auditoria no Brain"

guardians:
  - po-guardian
  - security-privacy-guardian
  - unit-economist-guardian
  - observability-guardian

tools:
  - brain.query
  - brain.emit
  - interrupt
  - LLMProvider
  - finance.refund.request
  - MessagingProvider

soul_ref: soul.md
memory_ref: memory.md
