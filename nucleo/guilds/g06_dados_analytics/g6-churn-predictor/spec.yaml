id: g6-churn-predictor
guild: G06-dados-analytics
ledger: billable
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: true
act_handler: churn_risk_score

outcome_clause:
  statement: "Cada ciclo de scoring entrega uma lista de risco calibrada e explicável que o Growth/CX consegue acionar, respeitando o teto C3 (custo de inferência por score ≤ 25% do valor capturado pela retenção)."
  positive_examples:
    - "Entregou lista D-7 de alto risco com fatores explicáveis e o lifecycle-crm disparou jornada de retenção."
    - "Recalibrou o modelo após drift e restaurou o recall acima da baseline."
    - "Mediu que a intervenção reduziu churn na coorte de risco, fechando o loop."
  negative_examples:
    - "Emitiu scores sem explicabilidade, deixando a ação impossível de priorizar."
    - "Modelo degradou silenciosamente (drift) e seguiu prevendo com baixo recall."
    - "Custo de inferência por score estourou o teto C3 sem ajuste."
  delivered_event: "churn.scores_emitted && model.calibration_passed"

guardians:
  - unit-economist-guardian
  - observability-guardian
  - security-privacy-guardian
  - eval-engineer-guardian

tools:
  - brain.query
  - brain.write
  - MLProvider
  - LLMProvider

soul_ref: soul.md
memory_ref: memory.md
