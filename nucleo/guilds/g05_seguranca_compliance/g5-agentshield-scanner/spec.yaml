id: g5-agentshield-scanner
guild: G05-seguranca-compliance
ledger: operating
tier: L2
ai_enabled: true
model_role: guardian
mode: SHADOW
target_mode: AUTONOMOUS
act_handler: agentshield_scan
outcome_clause:
  statement: 'AgentShield Scanner entrega agentshield_scanner.artifact verificável
    para: varrer continuamente as configs, definições MCP e hooks dos 150+ agentes
    para garantir que nenhum subgrafo viole o padrão de segurança AgentShield (ECC).'
  positive_examples:
  - Recebe input válido e publica agentshield_scanner.artifact com status ready e
    evidência rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g5-agentshield-scanner.delivered == true and artifact_type == 'agentshield_scanner.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- security-privacy-guardian
- observability-guardian
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
