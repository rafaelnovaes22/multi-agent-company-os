id: g10-invoicing
guild: G10-financas
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: ASSISTED
multi_tenant: true
act_handler: fin_invoice_tax

outcome_clause:
  statement: "Todo recebimento cobrável tem documento fiscal válido, autorizado e arquivado, sem pendência fiscal por falta de emissão, conforme o regime tributário BR vigente informado pelo tax-compliance."
  positive_examples:
    - "Documento emitido e autorizado dentro do prazo legal para 100% das cobranças aprovadas"
    - "Retificação aplicada com versão anterior preservada e protocolo novo arquivado"
    - "Documento <-> cobrança <-> recebimento conciliados sem lacuna"
  negative_examples:
    - "Emitiu com alíquota de regime errado por não consultar o tax-compliance"
    - "Cobrança recebida sem documento fiscal correspondente"
    - "Cancelou documento sem manter trilha da versão original"
  delivered_event: "invoice.issued publicado no Brain com authorization_protocol válido e link para XML/PDF imutável"

guardians:
  - po-guardian
  - security-privacy-guardian
  - observability-guardian
  - artifact-architect-guardian

tools:
  - FiscalDocumentProvider
  - ledger.read
  - ledger.write
  - brain.query
  - brain.write
  - MessagingProvider

soul_ref: soul.md
memory_ref: memory.md
