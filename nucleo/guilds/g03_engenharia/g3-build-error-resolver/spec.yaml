id: g3-build-error-resolver
guild: G03-engenharia
ledger: operating
tier: L2
ai_enabled: true
model_role: worker
mode: SHADOW
target_mode: AUTONOMOUS
act_handler: spec_executor
# VERIFY-IN-EVAL (F0): delivered passa a ser consequência de um ORÁCULO (verify_code) sobre o
# artefato {files}, não auto-declaração. delivered_event (C2, regra hard) é MANTIDO; delivered_when
# adiciona o predicado verificável. OFFLINE só static_ok move; delivered_ok exige execução (F2).
delivered_when: static_ok and tests_pass
outcome_clause:
  statement: 'Resolvedor de Erros de Build/CI entrega build_error_resolver.artifact
    verificável para: diagnosticar e corrigir falhas de compilação e de CI rapidamente,
    mantendo o pipeline verde.'
  positive_examples:
  - Recebe input válido e publica build_error_resolver.artifact com status ready e
    evidência rastreável.
  - Roteia ou bloqueia trabalho com critério explícito quando risco alto exige revisão
    humana.
  - Registra artefato, rota e rationale sem depender de tenant, segmento ou fornecedor
    hardcoded.
  negative_examples:
  - Declara sucesso sem artefato verificável ou sem status explícito.
  - Executa ação de alto risco sem sinalizar revisão humana.
  - Codifica regra específica de cliente, segmento, alíquota ou fornecedor no código
    do agente.
  delivered_event: g3-build-error-resolver.delivered == true and artifact_type ==
    'build_error_resolver.artifact'
economics:
  cost_model: cost_per_outcome
  max_ratio: 0.25
guardians:
- po-guardian
- observability-guardian
- artifact-architect
tools:
- brain.query
- brain.write
- queue.dispatch
- policy.check
- LLMProvider
soul_ref: soul.md
memory_ref: memory.md
